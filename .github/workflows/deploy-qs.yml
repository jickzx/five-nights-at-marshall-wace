name: Deploy QS
on:
  push:
    branches: [main]
    paths:
      - 'qs-backend/**'
      - 'src/qs/**'
      - 'qs/**'
      - '.github/workflows/deploy-qs.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Identify changed projects and configured credentials
        id: targets
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ORG: ${{ secrets.VERCEL_ORG_ID }}
          API: ${{ secrets.VERCEL_PROJECT_ID_QS_BACKEND }}
          SITE: ${{ secrets.VERCEL_PROJECT_ID_QS_SITE }}
          BEFORE: ${{ github.event.before }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          else
            changed=$(git ls-files)
          fi
          if [ -n "$TOKEN" ] && [ -n "$ORG" ] && [ -n "$API" ] && printf '%s\n' "$changed" | grep -q '^qs-backend/'; then echo 'api=true' >> "$GITHUB_OUTPUT"; fi
          if [ -n "$TOKEN" ] && [ -n "$ORG" ] && [ -n "$SITE" ] && printf '%s\n' "$changed" | grep -Eq '^(src/qs/|qs/)'; then echo 'site=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.targets.outputs.api == 'true' || steps.targets.outputs.site == 'true'
        with:
          node-version: '22'
      - name: Install Vercel CLI
        if: steps.targets.outputs.api == 'true' || steps.targets.outputs.site == 'true'
        run: npm install --global vercel@65.16.0
      - name: Deploy API
        if: steps.targets.outputs.api == 'true'
        working-directory: qs-backend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_QS_BACKEND }}
        run: vercel deploy --prod --yes
      - name: Deploy site
        if: steps.targets.outputs.site == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_QS_SITE }}
        run: vercel deploy --prod --yes
