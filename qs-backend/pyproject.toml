[project]
name = "qs-backend"
version = "0.1.0"
description = "QS telemetry: per-question motion records from VR assessment sessions (FastAPI + Supabase)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "numpy>=2.0",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.9",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "uvicorn>=0.30",
  "pgserver>=0.1.4",       # a pip-installed Postgres, for tests/test_sql_rls.py
  "psycopg[binary]>=3.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`:DeprecationWarning"]

[tool.uv]
package = false
